name: Lidl library

# Daily: stores the preview of every product published on lidl.rs, keeps the ones Lidl removes,
# and gives price-list products a Lidl photo when a barcode matches.
on:
  schedule:
    - cron: "17 5 * * *" # 06:17 / 07:17 Belgrade time
  workflow_dispatch:

concurrency:
  group: import
  cancel-in-progress: false

jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run import:lidl
