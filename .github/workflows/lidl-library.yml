name: Lidl library

# Stores the preview of every product published on lidl.rs, keeps the ones Lidl removes,
# and gives price-list products a Lidl photo when a barcode matches.
#
# When lidl.rs changes: Lidl's editors publish products on weekdays during office hours (they show up in the site
# search right away), and the sitemaps of all Lidl countries are rebuilt once a night at about 23:05 UTC.
# Runs that find nothing new take about a minute and are not recorded.
on:
  schedule:
    - cron: "17 6-16 * * 1-5" # hourly on weekdays, 07:17–17:17 Belgrade time in winter (08:17–18:17 in summer)
    - cron: "37 23 * * *" # every night, half an hour after the sitemap rebuild
  workflow_dispatch:

concurrency:
  group: import
  cancel-in-progress: false

jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run import:lidl
      # GitHub turns schedules off in public repositories after 60 days without commits; re-enabling resets the clock.
      - if: github.event_name == 'schedule' && github.event.schedule == '37 23 * * *'
        run: gh workflow enable lidl-library.yml --repo "$GITHUB_REPOSITORY" || true
        env:
          GH_TOKEN: ${{ github.token }}
