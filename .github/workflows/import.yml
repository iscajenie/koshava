name: Import Lidl price list

# Manual for the pilot (Actions -> Run workflow). For daily updates add:
#   schedule:
#     - cron: "23 8,14 * * *"   # Lidl publishes the list in the morning, Belgrade time
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full: prices + every photo source, Lidl library included (~30 min); quick: prices, photos for new products, Maxi (~15 min)"
        type: choice
        options: [full, quick]
        default: quick
      maxi_missing:
        description: "Also look for Maxi photos for products that have none"
        type: boolean
        default: false

concurrency:
  group: import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run import:prices
      # Lidl's own photos (library, see lidl-library.yml), then the Open Food Facts dumps and API for what is left.
      - if: inputs.mode == 'full'
        run: npm run import:lidl
      - if: inputs.mode == 'full'
        run: npm run import:dumps
      - run: npm run import:content -- --limit=300
      # Maxi photos replace Open Food Facts ones where Maxi carries the barcode.
      - run: npm run import:maxi -- ${{ inputs.maxi_missing && '--include-missing' || '' }}
      # Idea photos for what is still missing or from Open Food Facts (reads Idea's whole catalog, ~10 min).
      - run: npm run import:idea
