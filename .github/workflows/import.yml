name: Import Lidl price list

# Manual for the pilot (Actions -> Run workflow). For daily updates add:
#   schedule:
#     - cron: "23 8,14 * * *"   # Lidl publishes the list in the morning, Belgrade time
on:
  workflow_dispatch:

concurrency:
  group: import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run import:prices
      # Bulk photo lookup from the Open Food Facts dumps, then lidl.rs and the API for what is left.
      - run: npm run import:dumps
      - run: npm run import:content -- --limit=300
