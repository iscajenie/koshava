# Optional local database: `docker compose up -d`, then DATABASE_URL=postgres://postgres:postgres@localhost:5432/koshava
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: koshava
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
